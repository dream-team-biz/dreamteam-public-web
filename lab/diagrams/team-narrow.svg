<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="team-dg team-dg-narrow" lang="en" width="360" height="900" viewBox="0 0 360 900" role="img" aria-labelledby="team-narrow-title team-narrow-desc" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">
<title id="team-narrow-title">The engineer in control, the orchestrator agent and the specialist agents</title>
<desc id="team-narrow-desc">The engineer in control approves the vision, the plan, each task's readiness and the result. An orchestrator agent hands the work to specialist AI agents, who report back to it. They are an architect, backend and frontend developers, DevOps, a reviewer with no editing tools, a tester and a technical writer. The agents do not hand work to each other.</desc>
<style>
.team-dg {
  --tm-surface: var(--surface, #FFFFFF);
  --tm-surface-2: var(--surface-2, #F8FAFD);
  --tm-ink: var(--ink, #0E1726);
  --tm-graphite: var(--graphite, #4B5565);
  --tm-line: var(--line, #DCE3EE);
  --tm-blue: var(--blue, #2F6BFF);
  --tm-blue-wash: var(--blue-wash, #EAF0FF);
  --tm-human: var(--human, #E8A33D);
  --tm-human-ink: var(--human-ink, #8A5300);
  --tm-human-wash: var(--human-wash, #FFF4E0);
}
@media (prefers-color-scheme: dark) {
  .team-dg {
    --tm-surface: var(--surface, #111A2C);
    --tm-surface-2: var(--surface-2, #0E1626);
    --tm-ink: var(--ink, #E6EAF2);
    --tm-graphite: var(--graphite, #B4BDCD);
    --tm-line: var(--line, #24314A);
    --tm-blue: var(--blue, #7FA3FF);
    --tm-blue-wash: var(--blue-wash, #16213A);
    --tm-human: var(--human, #F2B04C);
    --tm-human-ink: var(--human-ink, #F6C77A);
    --tm-human-wash: var(--human-wash, #2A2113);
  }
}
.team-dg text { font-family: var(--font-body, 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif); }
.team-dg .tm-display { font-family: var(--font-display, 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif); }
.team-dg .tm-card { fill: var(--tm-surface); stroke: var(--tm-line); }
.team-dg .tm-human { fill: var(--tm-human-wash); stroke: var(--tm-human); }
.team-dg .tm-mark { fill: var(--tm-human); }
.team-dg .tm-orch { fill: var(--tm-blue-wash); stroke: var(--tm-blue); }
.team-dg .tm-agents { fill: var(--tm-surface-2); stroke: var(--tm-line); }
.team-dg .tm-group { fill: var(--tm-blue-wash); stroke: var(--tm-blue); }
.team-dg .tm-role { fill: var(--tm-surface); stroke: var(--tm-blue); }
.team-dg .tm-arrow { stroke: var(--tm-graphite); }
.team-dg .tm-head { fill: var(--tm-graphite); }
.team-dg .tm-t-human { fill: var(--tm-human-ink); }
.team-dg .tm-t-ink { fill: var(--tm-ink); }
.team-dg .tm-t-soft { fill: var(--tm-graphite); }
</style>
<rect class="tm-card" x="0.5" y="0.5" width="359" height="899" rx="12" fill="#FFFFFF" stroke="#DCE3EE" stroke-width="1"/>
<rect class="tm-human" x="12" y="12" width="336" height="151" rx="10" fill="#FFF4E0" stroke="#E8A33D" stroke-width="1.5"/>
<text class="tm-t-human tm-display" font-size="17" font-weight="700" text-anchor="middle" fill="#8A5300"><tspan x="180" y="41.45">Engineer in control</tspan></text>
<polygon class="tm-mark" points="92.55,66.5 98.15,60.9 103.75,66.5 98.15,72.1" fill="#E8A33D"/>
<text class="tm-t-human" font-size="14" font-weight="600" fill="#8A5300"><tspan x="110.75" y="71.4">You approve the vision</tspan></text>
<polygon class="tm-mark" points="92.55,91.5 98.15,85.9 103.75,91.5 98.15,97.1" fill="#E8A33D"/>
<text class="tm-t-human" font-size="14" font-weight="600" fill="#8A5300"><tspan x="110.75" y="96.4">You approve the plan</tspan></text>
<polygon class="tm-mark" points="92.55,116.5 98.15,110.9 103.75,116.5 98.15,122.1" fill="#E8A33D"/>
<text class="tm-t-human" font-size="14" font-weight="600" fill="#8A5300"><tspan x="110.75" y="121.4">You confirm it's ready</tspan></text>
<polygon class="tm-mark" points="92.55,141.5 98.15,135.9 103.75,141.5 98.15,147.1" fill="#E8A33D"/>
<text class="tm-t-human" font-size="14" font-weight="600" fill="#8A5300"><tspan x="110.75" y="146.4">You approve the result</tspan></text>
<line class="tm-arrow" x1="160" y1="165" x2="160" y2="213" fill="none" stroke="#4B5565" stroke-width="2"/>
<polygon class="tm-head" points="160,223 154.5,213 165.5,213" fill="#4B5565"/>
<line class="tm-arrow" x1="200" y1="223" x2="200" y2="175" fill="none" stroke="#4B5565" stroke-width="2"/>
<polygon class="tm-head" points="200,165 205.5,175 194.5,175" fill="#4B5565"/>
<text class="tm-t-soft" font-size="14" font-weight="400" text-anchor="end" fill="#4B5565"><tspan x="150" y="198.9">Goals and decisions</tspan></text>
<text class="tm-t-soft" font-size="14" font-weight="400" fill="#4B5565"><tspan x="210" y="189.4">Plan, result,</tspan><tspan x="210" y="208.4">open questions</tspan></text>
<rect class="tm-orch" x="12" y="225" width="336" height="64" rx="10" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="2"/>
<text class="tm-t-ink tm-display" font-size="17" font-weight="700" text-anchor="middle" fill="#0E1726"><tspan x="180" y="252.45">Orchestrator agent</tspan></text>
<text class="tm-t-soft" font-size="14" font-weight="400" text-anchor="middle" fill="#4B5565"><tspan x="180" y="274.4">Runs the steps and keeps the record</tspan></text>
<line class="tm-arrow" x1="160" y1="291" x2="160" y2="333" fill="none" stroke="#4B5565" stroke-width="2"/>
<polygon class="tm-head" points="160,343 154.5,333 165.5,333" fill="#4B5565"/>
<line class="tm-arrow" x1="200" y1="343" x2="200" y2="301" fill="none" stroke="#4B5565" stroke-width="2"/>
<polygon class="tm-head" points="200,291 205.5,301 194.5,301" fill="#4B5565"/>
<text class="tm-t-soft" font-size="14" font-weight="400" text-anchor="end" fill="#4B5565"><tspan x="150" y="321.9">Hands out the work</tspan></text>
<text class="tm-t-soft" font-size="14" font-weight="400" fill="#4B5565"><tspan x="210" y="321.9">Results</tspan></text>
<rect class="tm-agents" x="12" y="345" width="336" height="441" rx="10" fill="#F8FAFD" stroke="#DCE3EE" stroke-width="1.5"/>
<text class="tm-t-ink tm-display" font-size="17" font-weight="700" text-anchor="middle" fill="#0E1726"><tspan x="180" y="372.45">Specialist agents</tspan></text>
<rect class="tm-group" x="22" y="386" width="316" height="75" rx="8" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1.5"/>
<text class="tm-t-ink" font-size="15" font-weight="600" fill="#0E1726"><tspan x="32" y="411.25">Design — when a task needs one</tspan></text>
<rect class="tm-role" x="32" y="424" width="82" height="27" rx="6" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1"/>
<text class="tm-t-ink" font-size="14" font-weight="400" text-anchor="middle" fill="#0E1726"><tspan x="73" y="442.4">Architect</tspan></text>
<rect class="tm-group" x="22" y="469" width="316" height="141" rx="8" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1.5"/>
<text class="tm-t-ink" font-size="15" font-weight="600" fill="#0E1726"><tspan x="32" y="494.25">Build — chosen for each task</tspan></text>
<rect class="tm-role" x="32" y="507" width="151" height="27" rx="6" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1"/>
<text class="tm-t-ink" font-size="14" font-weight="400" text-anchor="middle" fill="#0E1726"><tspan x="107.5" y="525.4">Backend developer</tspan></text>
<rect class="tm-role" x="32" y="540" width="154" height="27" rx="6" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1"/>
<text class="tm-t-ink" font-size="14" font-weight="400" text-anchor="middle" fill="#0E1726"><tspan x="109" y="558.4">Frontend developer</tspan></text>
<rect class="tm-role" x="32" y="573" width="71" height="27" rx="6" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1"/>
<text class="tm-t-ink" font-size="14" font-weight="400" text-anchor="middle" fill="#0E1726"><tspan x="67.5" y="591.4">DevOps</tspan></text>
<rect class="tm-group" x="22" y="618" width="316" height="75" rx="8" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1.5"/>
<text class="tm-t-ink" font-size="15" font-weight="600" fill="#0E1726"><tspan x="32" y="643.25">Review and test the change</tspan></text>
<rect class="tm-role" x="32" y="656" width="206" height="27" rx="6" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1"/>
<text class="tm-t-ink" font-size="14" font-weight="400" text-anchor="middle" fill="#0E1726"><tspan x="135" y="674.4">Reviewer (no editing tools)</tspan></text>
<rect class="tm-role" x="244" y="656" width="64" height="27" rx="6" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1"/>
<text class="tm-t-ink" font-size="14" font-weight="400" text-anchor="middle" fill="#0E1726"><tspan x="276" y="674.4">Tester</tspan></text>
<rect class="tm-group" x="22" y="701" width="316" height="75" rx="8" fill="#EAF0FF" stroke="#2F6BFF" stroke-width="1.5"/>
<text class="tm-t-ink" font-size="15" font-weight="600" fill="#0E1726"><tspan x="32" y="726.25">Record the change</tspan></text>
<rect class="tm-role" x="32" y="739" width="132" height="27" rx="6" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1"/>
<text class="tm-t-ink" font-size="14" font-weight="400" text-anchor="middle" fill="#0E1726"><tspan x="98" y="757.4">Technical writer</tspan></text>
<polygon class="tm-mark" points="16,809.5 21.6,803.9 27.2,809.5 21.6,815.1" fill="#E8A33D"/>
<text class="tm-t-soft" font-size="14" font-weight="400" fill="#4B5565"><tspan x="34.2" y="814.4">Amber: a decision you make.</tspan></text>
<rect class="tm-role" x="16" y="827.5" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#2F6BFF" stroke-width="1"/>
<text class="tm-t-soft" font-size="14" font-weight="400" fill="#4B5565"><tspan x="38" y="839.4">Blue: an AI agent.</tspan></text>
<line class="tm-arrow" x1="16" y1="859.5" x2="30" y2="859.5" fill="none" stroke="#4B5565" stroke-width="2"/>
<polygon class="tm-head" points="40,859.5 30,865 30,854" fill="#4B5565"/>
<text class="tm-t-soft" font-size="14" font-weight="400" fill="#4B5565"><tspan x="48" y="864.4">Arrows: who passes work or results</tspan><tspan x="48" y="883.4">to whom.</tspan></text>
</svg>
